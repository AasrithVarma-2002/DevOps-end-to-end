server:
  port: 8080
  # Behind the AWS load balancer: trust X-Forwarded-* headers for redirects
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: hr-portal
  # Local development and tests: in-memory H2 in MySQL compatibility mode
  datasource:
    url: jdbc:h2:mem:hr;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  session:
    timeout: 30m
    jdbc:
      # tables are created by Flyway (V2)
      initialize-schema: never

app:
  # "Today" for leave rules (containers run in UTC)
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  # Sample departments, employees and holidays; demo logins use Password@123
  demo-data: ${APP_DEMO_DATA:true}
  bootstrap:
    # First Super Admin, created only when the database has no logins
    admin-email: ${APP_ADMIN_EMAIL:admin@hrportal.local}
    admin-password: ${APP_ADMIN_PASSWORD:Admin@12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
# AWS: Amazon RDS for MySQL. Values are injected into the pod; DB_PASSWORD and
# APP_ADMIN_PASSWORD come from AWS Secrets Manager.
spring:
  config:
    activate:
      on-profile: aws
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    hibernate:
      # Hibernate expects native MySQL ENUM columns; the Flyway schema uses VARCHAR
      ddl-auto: none

app:
  demo-data: ${APP_DEMO_DATA:false}
  bootstrap:
    admin-email: ${APP_ADMIN_EMAIL}
    admin-password: ${APP_ADMIN_PASSWORD}
