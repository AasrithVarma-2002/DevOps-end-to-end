<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isNew} ? 'Onboard new hire' : 'Edit employee')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('hr-employees')}"></header>
<main>
    <div class="page-head">
        <div>
            <h1 th:text="${isNew} ? 'Onboard new hire' : 'Edit employee'">Employee</h1>
            <p class="muted" th:if="${isNew}">Creates the employee record, their login and this year's leave allowance.</p>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form class="card form" method="post" th:object="${form}"
          th:action="${isNew} ? @{/hr/employees/new} : @{/hr/employees/{id}/edit(id=${form.id})}">
        <h2>Personal</h2>
        <div class="fields">
            <label for="firstName">First name <input id="firstName" th:field="*{firstName}" required maxlength="50"></label>
            <label for="lastName">Last name <input id="lastName" th:field="*{lastName}" required maxlength="50"></label>
            <label for="email">Work email <span class="hint">also their login</span>
                <input id="email" type="email" th:field="*{email}" required maxlength="120"></label>
            <label for="phone">Phone <input id="phone" th:field="*{phone}" maxlength="20"></label>
        </div>
        <h2>Job</h2>
        <div class="fields">
            <label for="employeeCode">Employee code <input id="employeeCode" th:field="*{employeeCode}" required maxlength="20" placeholder="EMP-1007"></label>
            <label for="jobTitle">Job title <input id="jobTitle" th:field="*{jobTitle}" required maxlength="100"></label>
            <label for="departmentId">Department
                <select id="departmentId" th:field="*{departmentId}" required>
                    <option value="">Select…</option>
                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                </select></label>
            <label for="managerId">Manager <span class="hint">leave requests go to this person</span>
                <select id="managerId" th:field="*{managerId}">
                    <option value="">No manager (requests go to HR)</option>
                    <option th:each="m : ${managers}" th:value="${m.id}" th:text="${m.fullName} + ' · ' + ${m.jobTitle}"></option>
                </select></label>
            <label for="salary">Monthly salary (₹) <input id="salary" type="number" step="0.01" min="1" th:field="*{salary}" required></label>
            <label for="joiningDate">Joining date <input id="joiningDate" type="date" th:field="*{joiningDate}" required></label>
            <label for="role" th:if="${isNew}">Access level
                <select id="role" th:field="*{role}">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}"></option>
                </select></label>
        </div>
        <div class="actions">
            <button type="submit" class="btn primary" th:text="${isNew} ? 'Onboard employee' : 'Save changes'">Save</button>
            <a class="btn" th:href="${isNew} ? @{/hr/employees} : @{/hr/employees/{id}(id=${form.id})}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
