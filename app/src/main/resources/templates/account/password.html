<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('')}"></header>
<main>
    <div class="page-head"><h1>Change password</h1></div>
    <div class="alert info" th:if="${forced}">
        You signed in with a temporary password. Choose your own password to continue.</div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <form class="card form" style="max-width:480px" th:action="@{/account/password}" method="post">
        <label for="currentPassword">Current password
            <input id="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required></label>
        <label for="newPassword">New password <span class="hint">At least 8 characters, with letters and numbers</span>
            <input id="newPassword" type="password" name="newPassword" autocomplete="new-password" minlength="8" required></label>
        <label for="confirmPassword">Repeat new password
            <input id="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" required></label>
        <div class="actions"><button type="submit" class="btn primary">Change password</button></div>
    </form>
</main>
</body>
</html>
