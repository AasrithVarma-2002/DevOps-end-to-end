<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My profile')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('')}"></header>
<main class="stack">
    <div class="page-head">
        <div><h1 th:text="${employee.fullName}">Name</h1>
            <p class="muted" th:text="${employee.jobTitle} + ' · ' + ${employee.department.name}">Title</p></div>
        <a class="btn" th:href="@{/profile/edit}">Edit contact details</a>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <section class="card">
        <dl class="details">
            <dt>Employee code</dt><dd th:text="${employee.employeeCode}"></dd>
            <dt>Email</dt><dd th:text="${employee.email}"></dd>
            <dt>Manager</dt><dd th:text="${employee.managerName} ?: 'None'"></dd>
            <dt>Joining date</dt><dd th:text="${#temporals.format(employee.joiningDate, 'd MMM yyyy')}"></dd>
            <dt>Phone</dt><dd th:text="${employee.phone} ?: '—'"></dd>
            <dt>Address</dt><dd th:text="${employee.address} ?: '—'"></dd>
            <dt>Emergency contact</dt>
            <dd th:text="${employee.emergencyContactName} ? ${employee.emergencyContactName} + ' (' + ${employee.emergencyContactPhone} + ')' : '—'"></dd>
        </dl>
        <p class="muted small" style="margin-top:14px">Job title, department, manager and salary are managed by HR.</p>
    </section>
</main>
</body>
</html>
