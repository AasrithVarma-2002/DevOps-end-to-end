# Copies the HR Portal secrets from AWS Secrets Manager into the Kubernetes Secret
# "hr-portal-secrets". The app's Deployment loads every key as an environment variable.
#
# Owned by the cluster admin, not by the app's Helm chart: Jenkins deploys the app but
# never manages where its credentials come from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hr-portal-secrets
  namespace: hr-portal
spec:
  refreshInterval: 1h # re-read AWS every hour (pods read env vars at start, so restart them after a rotation)
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: hr-portal-secrets
    creationPolicy: Owner # the Secret is deleted if this ExternalSecret is deleted
  data:
    # Kubernetes key   <-  AWS secret (terraform/secrets.tf)  +  JSON field
    - secretKey: DB_HOST
      remoteRef: { key: hr-portal/db, property: host }
    - secretKey: DB_PORT
      remoteRef: { key: hr-portal/db, property: port }
    - secretKey: DB_NAME
      remoteRef: { key: hr-portal/db, property: dbname }
    - secretKey: DB_USERNAME
      remoteRef: { key: hr-portal/db, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: hr-portal/db, property: password }
    - secretKey: APP_ADMIN_EMAIL
      remoteRef: { key: hr-portal/app-admin, property: email }
    - secretKey: APP_ADMIN_PASSWORD
      remoteRef: { key: hr-portal/app-admin, property: password }
