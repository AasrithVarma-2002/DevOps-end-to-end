# Tells External Secrets Operator how to reach AWS Secrets Manager.
# No auth block: ESO uses its own IRSA role (hr-portal-external-secrets, terraform/iam-irsa.tf),
# which may read only hr-portal/db and hr-portal/app-admin.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
