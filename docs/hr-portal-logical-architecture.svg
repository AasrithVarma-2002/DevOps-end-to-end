<text x="66" y="163" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">logins, roles and company setup</text>
<rect x="406" y="122" width="332" height="51" rx="8" fill="#ffffff" stroke="#6d3fc0" stroke-width="1.6"/>
<rect x="406" y="122" width="6" height="51" rx="2" fill="#6d3fc0"/>
<text x="422" y="144" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">HR Admin</text>
<text x="422" y="163" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">people, payroll, documents, exits</text>
<rect x="762" y="122" width="332" height="51" rx="8" fill="#ffffff" stroke="#6d3fc0" stroke-width="1.6"/>
<rect x="762" y="122" width="6" height="51" rx="2" fill="#6d3fc0"/>
<text x="778" y="144" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Manager</text>
<text x="778" y="163" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">team leave and team attendance</text>
<rect x="1118" y="122" width="332" height="51" rx="8" fill="#ffffff" stroke="#6d3fc0" stroke-width="1.6"/>
<rect x="1118" y="122" width="6" height="51" rx="2" fill="#6d3fc0"/>
<text x="1134" y="144" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Employee</text>
<text x="1134" y="163" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">self-service for their own records</text>
<rect x="30" y="215" width="1440" height="118" rx="10" fill="#eef4fb" stroke="#1f4e79" stroke-width="1.3"/>
<text x="46" y="237" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="start">Presentation · how users reach the system</text>
<rect x="50" y="247" width="692" height="68" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.6"/>
<rect x="50" y="247" width="6" height="68" rx="2" fill="#1f4e79"/>
<text x="66" y="269" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Web user interface</text>
<text x="66" y="288" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">pages and menus tailored to each role</text>
<text x="66" y="305" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">forms, tables, dashboards and a notification bell</text>
<rect x="758" y="247" width="692" height="68" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.6"/>
<rect x="758" y="247" width="6" height="68" rx="2" fill="#1f4e79"/>
<text x="774" y="269" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">REST API</text>
<text x="774" y="288" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">the same features for other systems</text>
<text x="774" y="305" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">documented, and bound by the same rules as the web pages</text>
<rect x="30" y="357" width="1440" height="118" rx="10" fill="#fdf0f0" stroke="#c92a2a" stroke-width="1.3"/>
<text x="46" y="379" font-size="14" font-weight="bold" fill="#a61e1e" text-anchor="start">Access control · checked on every request</text>
<rect x="50" y="389" width="268" height="68" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="1.6"/>
<rect x="50" y="389" width="6" height="68" rx="2" fill="#c92a2a"/>
<text x="66" y="411" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Authentication</text>
<text x="66" y="430" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">who are you?</text>
<text x="66" y="447" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">work email and password</text>
<rect x="333" y="389" width="268" height="68" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="1.6"/>
<rect x="333" y="389" width="6" height="68" rx="2" fill="#c92a2a"/>
<text x="349" y="411" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Role-based access</text>
<text x="349" y="430" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">which pages and actions</text>
<text x="349" y="447" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">your role is allowed</text>
<rect x="616" y="389" width="268" height="68" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="1.6"/>
<rect x="616" y="389" width="6" height="68" rx="2" fill="#c92a2a"/>
<text x="632" y="411" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Ownership checks</text>
<text x="632" y="430" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">only your own payslips,</text>
<text x="632" y="447" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">documents and team</text>
<rect x="899" y="389" width="268" height="68" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="1.6"/>
<rect x="899" y="389" width="6" height="68" rx="2" fill="#c92a2a"/>
<text x="915" y="411" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Account protection</text>
<text x="915" y="430" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">lockout after 5 tries,</text>
<text x="915" y="447" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">password change on first login</text>
<rect x="1182" y="389" width="268" height="68" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="1.6"/>
<rect x="1182" y="389" width="6" height="68" rx="2" fill="#c92a2a"/>
<text x="1198" y="411" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Session management</text>
<text x="1198" y="430" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">sessions are shared, so any</text>
<text x="1198" y="447" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">copy of the app can serve you</text>
<rect x="30" y="499" width="1440" height="286" rx="10" fill="#eef7ea" stroke="#2b8a3e" stroke-width="1.3"/>
<text x="46" y="521" font-size="14" font-weight="bold" fill="#2b6a2b" text-anchor="start">Business modules · each one owns its rules</text>
<rect x="50" y="531" width="330" height="68" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.6"/>
<rect x="50" y="531" width="6" height="68" rx="2" fill="#2b8a3e"/>
<text x="66" y="553" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Employee management</text>
<text x="66" y="572" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">onboard, edit and offboard</text>
<text x="66" y="589" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">temporary login for new hires</text>
<rect x="396" y="531" width="330" height="68" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.6"/>
<rect x="396" y="531" width="6" height="68" rx="2" fill="#2b8a3e"/>
<text x="412" y="553" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Organisation setup</text>
<text x="412" y="572" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">departments</text>
<text x="412" y="589" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">public holiday calendar</text>
<rect x="742" y="531" width="330" height="68" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.6"/>
<rect x="742" y="531" width="6" height="68" rx="2" fill="#2b8a3e"/>
<text x="758" y="553" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">User accounts</text>
<text x="758" y="572" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">roles, unlock, disable</text>
<text x="758" y="589" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">reset password</text>
<rect x="50" y="615" width="330" height="68" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.6"/>
<rect x="50" y="615" width="6" height="68" rx="2" fill="#2b8a3e"/>
<text x="66" y="637" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Leave management</text>
<text x="66" y="656" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">balances, apply, approve</text>
<text x="66" y="673" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">manager, then HR for long leave</text>
<rect x="396" y="615" width="330" height="68" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.6"/>
<rect x="396" y="615" width="6" height="68" rx="2" fill="#2b8a3e"/>
<text x="412" y="637" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Attendance</text>
<text x="412" y="656" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">check in and check out</text>
<text x="412" y="673" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">HR corrections with a reason</text>
<rect x="742" y="615" width="330" height="68" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.6"/>
<rect x="742" y="615" width="6" height="68" rx="2" fill="#2b8a3e"/>
<text x="758" y="637" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Payroll &amp; payslips</text>
<text x="758" y="656" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">draft, review, finalize</text>
<text x="758" y="673" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">loss of pay, deductions, payslips</text>
<rect x="50" y="699" width="330" height="68" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.6"/>
<rect x="50" y="699" width="6" height="68" rx="2" fill="#2b8a3e"/>
<text x="66" y="721" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Documents</text>
<text x="66" y="740" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">employee uploads, HR verifies</text>
<text x="66" y="757" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">onboarding checklist, HR letters</text>
<rect x="396" y="699" width="330" height="68" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.6"/>
<rect x="396" y="699" width="6" height="68" rx="2" fill="#2b8a3e"/>
<text x="412" y="721" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Resignations</text>
<text x="412" y="740" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">submit, withdraw, accept, decline</text>
<text x="412" y="757" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">notice period, automatic exit</text>
<rect x="742" y="699" width="330" height="68" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.6"/>
<rect x="742" y="699" width="6" height="68" rx="2" fill="#2b8a3e"/>
<text x="758" y="721" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Reports</text>
<text x="758" y="740" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">attendance, leave, payroll</text>
<text x="758" y="757" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">downloadable spreadsheets</text>
<rect x="1086" y="507" width="376" height="270" rx="8" fill="#fff6e6" stroke="#c98a1b" stroke-width="1.3"/>
<text x="1100" y="526" font-size="13" font-weight="bold" fill="#8a4b00" text-anchor="start">Shared services · used by every module</text>
<rect x="1100" y="539" width="350" height="68" rx="8" fill="#ffffff" stroke="#c98a1b" stroke-width="1.6"/>
<rect x="1100" y="539" width="6" height="68" rx="2" fill="#c98a1b"/>
<text x="1116" y="561" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Scheduled jobs</text>
<text x="1116" y="580" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">daily and month-end reminders</text>
<text x="1116" y="597" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">nightly exits; each run happens once</text>
<rect x="1100" y="617" width="350" height="68" rx="8" fill="#ffffff" stroke="#c98a1b" stroke-width="1.6"/>
<rect x="1100" y="617" width="6" height="68" rx="2" fill="#c98a1b"/>
<text x="1116" y="639" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Audit trail</text>
<text x="1116" y="658" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">who did what and when</text>
<text x="1116" y="675" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">old and new values, read-only</text>
<rect x="1100" y="695" width="350" height="68" rx="8" fill="#ffffff" stroke="#c98a1b" stroke-width="1.6"/>
<rect x="1100" y="695" width="6" height="68" rx="2" fill="#c98a1b"/>
<text x="1116" y="717" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Notifications</text>
<text x="1116" y="736" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">in-app message and email</text>
<text x="1116" y="753" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">sent only after a change is saved</text>
<rect x="30" y="809" width="1440" height="118" rx="10" fill="#f6effa" stroke="#a24bc0" stroke-width="1.3"/>
<text x="46" y="831" font-size="14" font-weight="bold" fill="#7b2f96" text-anchor="start">Data and external services</text>
<rect x="50" y="841" width="332" height="68" rx="8" fill="#ffffff" stroke="#a24bc0" stroke-width="1.6"/>
<rect x="50" y="841" width="6" height="68" rx="2" fill="#a24bc0"/>
<text x="66" y="863" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Database</text>
<text x="66" y="882" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">the system of record: people, leave,</text>
<text x="66" y="899" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">attendance, payroll, audit, sessions</text>
<rect x="406" y="841" width="332" height="68" rx="8" fill="#ffffff" stroke="#a24bc0" stroke-width="1.6"/>
<rect x="406" y="841" width="6" height="68" rx="2" fill="#a24bc0"/>
<text x="422" y="863" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Document store</text>
<text x="422" y="882" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">payslip files, uploads, HR letters</text>
<text x="422" y="899" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">time-limited download links</text>
<rect x="762" y="841" width="332" height="68" rx="8" fill="#ffffff" stroke="#a24bc0" stroke-width="1.6"/>
<rect x="762" y="841" width="6" height="68" rx="2" fill="#a24bc0"/>
<text x="778" y="863" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Secret store</text>
<text x="778" y="882" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">database password, admin login</text>
<text x="778" y="899" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">read at start-up, never in code</text>
<rect x="1118" y="841" width="332" height="68" rx="8" fill="#ffffff" stroke="#a24bc0" stroke-width="1.6"/>
<rect x="1118" y="841" width="6" height="68" rx="2" fill="#a24bc0"/>
<text x="1134" y="863" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Email gateway</text>
<text x="1134" y="882" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">delivers notification emails</text>
<text x="1134" y="899" font-size="13" font-weight="normal" fill="#46525e" text-anchor="start">from a verified sender</text>
