{{- if gt (int .Values.replicaCount) 1 }}
# Keeps at least one pod running while nodes are drained (node upgrades, scale-in)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "hr-portal.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "hr-portal.selectorLabels" . | nindent 6 }}
{{- end }}
